; Replace /srv/app/current, /usr/bin/php and www-data for your deployment.
; Keep stopwaitsecs longer than your longest command/database transaction.
[program:socket-bridge-gateway]
directory=/srv/app/current
command=/usr/bin/php artisan socket-bridge:start --no-download
user=www-data
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/srv/app/current/storage/logs/socket-bridge-gateway.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:socket-bridge-commands]
directory=/srv/app/current
command=/usr/bin/php artisan socket-bridge:consume --max-time=3600 --memory=128
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=www-data
autostart=true
autorestart=true
startsecs=0
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/srv/app/current/storage/logs/socket-bridge-commands-%(process_num)02d.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:socket-bridge-outbox]
directory=/srv/app/current
command=/usr/bin/php artisan socket-bridge:outbox --max-time=3600 --memory=128
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=www-data
autostart=true
autorestart=true
startsecs=0
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/srv/app/current/storage/logs/socket-bridge-outbox-%(process_num)02d.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
