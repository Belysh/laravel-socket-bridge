# Include inside nginx's http block; use a dedicated gateway hostname.
# Replace realtime.example.com and certificate paths before enabling.
map $http_upgrade $socket_bridge_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name realtime.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name realtime.example.com;
    ssl_certificate /etc/ssl/socket-bridge/fullchain.pem;
    ssl_certificate_key /etc/ssl/socket-bridge/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $socket_bridge_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    # Scrape metrics over a private route directly to the gateway.
    location / { return 404; }
}
